spring:
  application:
    name: prontuario-app
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_prontuarios}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:admin}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
