name: CI/CD Pipeline - Paciente App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Java (Java 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Dar permissão de execução ao Maven Wrapper e compilar o projeto
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Get generated JAR name
        id: jar
        run: |
          jar_file=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)
          if [ -z "$jar_file" ]; then
            echo "No executable JAR found in target/." >&2
            exit 1
          fi
          echo "name=$(basename "$jar_file" .jar)" >> "$GITHUB_OUTPUT"

      # 4. Configurar o Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Fazer login no Docker Hub (Certifique-se de configurar os Secrets no GitHub)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build e Push da imagem Docker com a tag do commit atual
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: uverdocker/prontuario-app:${{ steps.jar.outputs.name }}